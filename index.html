<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div class="banner">
        <div class="logo-banner">
            <div class="logo-container">
                <img src="images/odin-lined.png" alt="">
            </div>
            <div class="logo-text">odin</div>
        </div>
    </div>
    <div class="main">
        <div class="description-box">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.<br>Sign up <em>now</em> to get started.</p>
            <p>You <em>know</em> you want to.</p>
        </div>
        <div class="form-area">
            <h2>Let's do this</h2>
            <form action="#" method="post" id="Signup-form">
                <div class="input-group">
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" id="first-name" name="first_name" placeholder="Thor" required>
                </div>
                <div class="input-group">
                    <label for="last-name">LAST NAME</label>
                    <input type="text" id="last-name" name="last_name" placeholder="Odinson" required>
                </div>
                <div class="input-group">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="phone">PHONE NUMBER</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                <div class="input-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" required class="error">
                </div>
                <div class="input-group">
                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input type="password" id="confirm-password" name="confirm_password" required class="error">
                </div>
            </form>
        </div>
        <div class="bottom-area">
            <button type="submit" form="signup-form">Create Account</button>
            <p>Already have an account? <a href="#">Log in</a></p>
        </div>
    </div> 
</body>
</html>
